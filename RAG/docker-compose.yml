services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: rag-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragdb

    ports:
      - "5434:5432"

    volumes:
      - rag_postgres_data:/var/lib/postgresql/data

volumes:
  rag_postgres_data: